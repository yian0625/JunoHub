name: junohub

services:
  junohub-server:
    build:
      context: ./junohub-server
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      JUNOHUB_BIND: 0.0.0.0:9003
      JUNOHUB_DATABASE_URL: sqlite:///data/junohub.db?mode=rwc
      JUNOHUB_ACCOUNT_ENGINE_GATEWAY_ENABLED: "true"
      JUNOHUB_SCHEDULER_WORKER_ENABLED: "true"
      RUST_LOG: ${RUST_LOG:-junohub_server=info,tower_http=info}
    volumes:
      - junohub-data:/data
    ports:
      - "${JUNOHUB_API_PORT:-9003}:9003"
    depends_on:
      junohub-accounts-postgres:
        condition: service_healthy
      junohub-accounts-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9003/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  junohub-web:
    build:
      context: ./junohub-web
      dockerfile: Dockerfile
      args:
        JUNO_HUB_API_URL: http://junohub-server:9003
    environment:
      JUNO_HUB_API_URL: http://junohub-server:9003
      HOSTNAME: 0.0.0.0
      PORT: 3003
    depends_on:
      junohub-server:
        condition: service_healthy
    ports:
      - "${JUNOHUB_WEB_PORT:-3003}:3003"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  junohub-accounts-postgres:
    image: postgres:18-alpine
    env_file:
      - ./.env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/accounts/postgres:/var/lib/postgresql/data
      - ./deploy/accounts-schema.sql:/docker-entrypoint-initdb.d/01-accounts-schema.sql:ro
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  junohub-accounts-redis:
    image: redis:8-alpine
    env_file:
      - ./.env
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --save 60 1 \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ./data/accounts/redis:/data
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  junohub-data:
    name: junohub-data
