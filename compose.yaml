name: junohub

# 所有持久化数据都放在 Docker 命名卷里，项目目录只保留代码和配置：
#   junohub-data               业务库（SQLite）：用户、访问密钥、模型路由、日志、账单
#   junohub-accounts-postgres  账户引擎账户池
#   junohub-accounts-redis     账户引擎调度/粘性会话（可重建，非关键）
# 备份与恢复请使用 ./deploy.sh backup / ./deploy.sh restore，不要手工复制数据目录。

services:
  junohub-server:
    build:
      context: ./junohub-server
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      JUNOHUB_BIND: 0.0.0.0:9003
      JUNOHUB_DATABASE_URL: sqlite:///data/junohub.db?mode=rwc
      JUNOHUB_ACCOUNT_ENGINE_GATEWAY_ENABLED: "true"
      JUNOHUB_SCHEDULER_WORKER_ENABLED: "true"
      RUST_LOG: ${RUST_LOG:-junohub_server=info,tower_http=info}
    volumes:
      - junohub-data:/data
    ports:
      - "${JUNOHUB_API_PORT:-9003}:9003"
    depends_on:
      junohub-accounts-postgres:
        condition: service_healthy
      junohub-accounts-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # 流式响应可能很长；给网关时间把在途请求跑完并释放账户并发槽，
    # 否则 Docker 默认 10 秒后 SIGKILL，会掐断客户端并让槽位滞留到 TTL 到期。
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9003/health/readiness"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  junohub-web:
    build:
      context: ./junohub-web
      dockerfile: Dockerfile
      args:
        JUNO_HUB_API_URL: http://junohub-server:9003
    environment:
      JUNO_HUB_API_URL: http://junohub-server:9003
      HOSTNAME: 0.0.0.0
      PORT: 3003
    depends_on:
      junohub-server:
        condition: service_healthy
    ports:
      - "${JUNOHUB_WEB_PORT:-3003}:3003"
      # 不占用官方客户端的固定 OAuth 回调端口（1455/8085/56121）。
      # JunoHub 授权使用手动粘贴回调地址，避免干扰本机官方客户端登录。
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  junohub-accounts-postgres:
    image: postgres:18-alpine
    # 只注入数据库自己需要的变量，不要整份 .env：里面还有 JUNOHUB_JWT_SECRET
    # 和 JUNOHUB_ENCRYPTION_KEY（账号凭据的解密主密钥），数据库容器没有任何
    # 理由拿到它们。缺变量时用 :? 直接报错退出，而不是带着空密码启动。
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必须在 .env 中设置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 必须在 .env 中设置}
    volumes:
      - junohub-accounts-postgres:/var/lib/postgresql/data
      - ./deploy/accounts-schema.sql:/docker-entrypoint-initdb.d/01-accounts-schema.sql:ro
    restart: unless-stopped
    # 让 PostgreSQL 有机会完成 fast shutdown，而不是被 SIGKILL 后走崩溃恢复。
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  junohub-accounts-redis:
    image: redis:8-alpine
    # 同上：Redis 只需要自己的密码，不需要应用密钥。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必须在 .env 中设置}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --save 60 1 \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$$REDIS_PASSWORD"
    volumes:
      - junohub-accounts-redis:/data
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  junohub-data:
    name: junohub-data
  junohub-accounts-postgres:
    name: junohub-accounts-postgres
  junohub-accounts-redis:
    name: junohub-accounts-redis
