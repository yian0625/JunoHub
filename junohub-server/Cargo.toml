[package]
name = "junohub-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
multer = "3.1"
http-body-util = "0.1"
prometheus = { version = "0.14", default-features = false, features = ["process"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jsonwebtoken = "9"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rust_decimal = {version="1",features=["serde"]}
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
json5 = "0.4"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "json"] }
thiserror = "2"
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "process"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
futures-executor = "0.3"
tempfile = "3"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
